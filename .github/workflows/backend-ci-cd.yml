name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - staging
      - master
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: ./backend

jobs:
  # ============================================
  # CI: Build, Lint, and Test
  # ============================================
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🧪 Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: 📊 Upload test coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

      - name: ✅ CI Completed
        run: echo "CI checks passed successfully"

  # ============================================
  # CD: Deploy to Staging
  # ============================================
  deploy-staging:
    name: CD - Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --production=false

      - name: 🗄️ Run database migrations
        run: node scripts/migrate.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        continue-on-error: false

      - name: 🚀 Trigger Render deployment
        id: deploy
        run: |
          echo "Deploying to Render staging..."
          
          DEPLOY_RESPONSE=$(curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_STAGING }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          
          DEPLOY_ID=$(echo $DEPLOY_RESPONSE | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "url=https://payeazie-staging.onrender.com" >> $GITHUB_OUTPUT
          
          if [ "$DEPLOY_ID" == "null" ]; then
            echo "❌ Failed to trigger deployment"
            echo $DEPLOY_RESPONSE
            exit 1
          fi
          
          echo "✅ Deployment triggered: $DEPLOY_ID"

      - name: ⏳ Wait for deployment to complete
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          MAX_WAIT=600  # 10 minutes
          ELAPSED=0
          
          echo "Waiting for deployment $DEPLOY_ID to complete..."
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_STAGING }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.status')
            
            echo "Status: $STATUS (${ELAPSED}s elapsed)"
            
            if [ "$STATUS" == "live" ]; then
              echo "✅ Deployment successful!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deactivated" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          echo "❌ Deployment timeout after ${MAX_WAIT}s"
          exit 1

      - name: 🏥 Health check
        run: |
          echo "Running health check..."
          MAX_RETRIES=10
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://payeazie-staging.onrender.com/health)
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            
            echo "⏳ Health check attempt $((RETRY + 1))/$MAX_RETRIES - Status: $HTTP_CODE"
            RETRY=$((RETRY + 1))
            sleep 5
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: 📢 Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Staging deployment successful"
            COLOR="good"
          else
            MESSAGE="❌ Staging deployment failed"
            COLOR="danger"
          fi
          
          # Slack notification (if webhook configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$MESSAGE\",\"color\":\"$COLOR\",\"username\":\"GitHub Actions\",\"icon_emoji\":\":rocket:\"}"
          fi
          
          echo "$MESSAGE"

  # ============================================
  # CD: Deploy to Production
  # ============================================
  deploy-production:
    name: CD - Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --production=false

      - name: 🗄️ Run database migrations
        run: node scripts/migrate.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        continue-on-error: false

      - name: 🚀 Trigger Render deployment
        id: deploy
        run: |
          echo "Deploying to Render production..."
          
          DEPLOY_RESPONSE=$(curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          
          DEPLOY_ID=$(echo $DEPLOY_RESPONSE | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "url=https://payeazie.onrender.com" >> $GITHUB_OUTPUT
          
          if [ "$DEPLOY_ID" == "null" ]; then
            echo "❌ Failed to trigger deployment"
            echo $DEPLOY_RESPONSE
            exit 1
          fi
          
          echo "✅ Deployment triggered: $DEPLOY_ID"

      - name: ⏳ Wait for deployment to complete
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          MAX_WAIT=600  # 10 minutes
          ELAPSED=0
          
          echo "Waiting for deployment $DEPLOY_ID to complete..."
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.status')
            
            echo "Status: $STATUS (${ELAPSED}s elapsed)"
            
            if [ "$STATUS" == "live" ]; then
              echo "✅ Deployment successful!"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deactivated" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          echo "❌ Deployment timeout after ${MAX_WAIT}s"
          exit 1

      - name: 🏥 Health check
        run: |
          echo "Running health check..."
          MAX_RETRIES=10
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://payeazie.onrender.com/health)
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            
            echo "⏳ Health check attempt $((RETRY + 1))/$MAX_RETRIES - Status: $HTTP_CODE"
            RETRY=$((RETRY + 1))
            sleep 5
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: 📢 Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Production deployment successful"
            COLOR="good"
          else
            MESSAGE="❌ Production deployment failed - IMMEDIATE ACTION REQUIRED"
            COLOR="danger"
          fi
          
          # Slack notification (if webhook configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"$MESSAGE\",\"color\":\"$COLOR\",\"username\":\"GitHub Actions\",\"icon_emoji\":\":rocket:\"}"
          fi
          
          echo "$MESSAGE"

      - name: 📝 Create deployment audit log
        if: success()
        run: |
          echo "=== DEPLOYMENT AUDIT LOG ===" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL**: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy ID**: ${{ steps.deploy.outputs.deploy_id }}" >> $GITHUB_STEP_SUMMARY
